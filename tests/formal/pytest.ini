[pytest]
addopts =
    -q
    --numprocesses=6
    --dist=worksteal
    -p no:slow-first
    -p tests.formal.helpers.fixtures.plugin
testpaths = conformance
pythonpath = ../.. ../../src
filterwarnings =
    ignore:distutils Version classes are deprecated:DeprecationWarning
    ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning
