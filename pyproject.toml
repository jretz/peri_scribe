[project]
name = "peri_scribe"
version = "0"
requires-python = "==3.14.*"
dependencies = [
    "arcgis",
    "click",
    "geopandas",
    "pydantic",
    "pygments",  # For pytest code highlighting
    "pyproj",
    "pytest-cov",
    "pytest",
    "requests",
    "requests-mock",
    "ruff",
    "setuptools",  # For https://github.com/Esri/arcgis-python-api/issues/2428
    "structlog",
    "tenacity",
    "time-machine",
    "ty",
]

[build-system]
requires = ["uv_build < 0.13"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "off"

[tool.pytest.ini_options]
addopts = [
    # pytest
    "--code-highlight=yes",
    "--doctest-modules",
    "--failed-first",
    "--quiet",
    "--showlocals",

    # pytest-cov
    "--cov-fail-under=99",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html",
    "--cov=src",
    "--no-cov-on-fail",
]
filterwarnings = [
    # Deprecation warnings raised at import time by third-party dependencies (arcgis,
    # setuptools) cannot be fixed in this project.
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Rule sets
    "C90",  # https://docs.astral.sh/ruff/rules/#mccabe-c90
    "D",  # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "DTZ",  # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
    "FIX",  # https://docs.astral.sh/ruff/rules/#flake8-fixme-fix
    "T20",  # https://docs.astral.sh/ruff/rules/#flake8-print-t20

    # Specific rules
    "unnecessary-collection-call",  # https://docs.astral.sh/ruff/rules/unnecessary-collection-call/
    "missing-copyright-notice",  # https://docs.astral.sh/ruff/rules/missing-copyright-notice/
    "too-many-arguments",  # https://docs.astral.sh/ruff/rules/too-many-arguments/
    "subprocess-without-shell-equals-true",  # https://docs.astral.sh/ruff/rules/subprocess-without-shell-equals-true/
    "hardcoded-sql-expression",  # https://docs.astral.sh/ruff/rules/hardcoded-sql-expression/
    "typing-only-standard-library-import",  # https://docs.astral.sh/ruff/rules/typing-only-standard-library-import/
    "missing-todo-author",  # https://docs.astral.sh/ruff/rules/missing-todo-author/
    "missing-todo-link",  # https://docs.astral.sh/ruff/rules/missing-todo-link/
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    # Specific rules
    "unused-function-argument",  # https://docs.astral.sh/ruff/rules/unused-function-argument/
    "compare-to-empty-string",  # https://docs.astral.sh/ruff/rules/compare-to-empty-string/
    "assert",  # https://docs.astral.sh/ruff/rules/assert/
]

[tool.ty.rules]
division-by-zero = "error"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unused-ignore-comment = "error"

[tool.uv.build-backend]
packages = ["src/peri_scribe"]

[tool.uv]
exclude-newer = "7 days"
python-preference = "only-managed"
