<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Fire updates · PeriScribe</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: light-dark(#f7f7f7, #1a1a1a);
      --surface: light-dark(#ffffff, #252525);
      --recent-surface: light-dark(#edf5eb, #2a382e);
      --ink: light-dark(#2d2d2d, #e8e8e8);
      --secondary: light-dark(#606060, #b8b8b8);
      --line: light-dark(#dfdfdf, #424242);
      --accent: light-dark(#a04722, #f1b58e);
      --correction: light-dark(#345f79, #a8cce0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 24px 36px 32px;
    }

    .name-filter {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }

    .name-filter::placeholder {
      color: var(--secondary);
      opacity: 1;
    }

    .snapshot {
      margin: 24px 0 0;
      color: var(--secondary);
      font-size: 12px;
    }

    .snapshot time {
      color: var(--ink);
      margin-left: 5px;
    }

    .section {
      margin-top: 24px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .name-filter:focus-visible,
    .sort-order:focus-visible,
    .group-toggle:focus-visible {
      outline: 2px solid var(--secondary);
      outline-offset: 2px;
    }

    .group-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .group-toggle::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      margin: 0 2px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
    }

    .group-toggle[aria-expanded="false"]::before {
      transform: rotate(-45deg);
    }

    .sort-order {
      margin-left: auto;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: var(--secondary);
      font: inherit;
      font-size: 12px;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 4px;
      cursor: pointer;
    }

    .sort-order:hover {
      color: var(--ink);
    }

    .group-body {
      position: relative;
    }

    .group-surface {
      position: absolute;
      inset: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      transform-origin: top left;
      pointer-events: none;
    }

    .updates {
      position: relative;
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 6px;
    }

    .update {
      position: relative;
      padding: 13px 16px 14px;
      background-color: var(--surface);
      transition: background-color 2s ease-in-out;
    }

    .update.recent {
      background-color: var(--recent-surface);
    }

    .update:first-child {
      border-radius: 5px 5px 0 0;
    }

    .update:last-child {
      border-radius: 0 0 5px 5px;
    }

    .update:only-child {
      border-radius: 5px;
    }

    .update+.update {
      border-top: 1px solid var(--line);
    }

    .fire-heading {
      display: flex;
      align-items: baseline;
      gap: 16px;
      min-width: 0;
    }

    .identity {
      display: flex;
      align-items: baseline;
      gap: 16px;
      min-width: 0;
      flex: 1;
    }

    .fire-name {
      margin: 0;
      flex: 0 1 auto;
      min-width: 0;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location {
      flex: 0 0 auto;
      min-width: 0;
      white-space: nowrap;
      color: var(--secondary);
      font-size: 13px;
    }

    .updated {
      flex: 0 0 auto;
      margin-left: auto;
      text-align: right;
      white-space: nowrap;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .acreages {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 10px 0 0;
      max-width: 540px;
      text-align: right;
    }

    .acreages dt {
      color: var(--secondary);
      font-size: 11px;
    }

    .acreages dd {
      margin: 3px 0 0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .current {
      font-weight: 650;
    }

    .increase {
      color: var(--accent);
    }

    .decrease {
      color: var(--correction);
    }

    .empty {
      padding: 16px;
      color: var(--secondary);
    }

    .departing-update {
      position: absolute;
      z-index: 10;
      margin: 0;
      list-style: none;
      pointer-events: none;
      border-radius: 5px;
    }

    .screen-reader {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }

    @media (max-width: 800px) {
      main {
        padding: 20px;
      }

      .identity {
        gap: 12px;
      }
    }

    @media (max-width: 620px) {
      main {
        padding: 18px 16px 24px;
      }

      .section {
        margin-top: 20px;
      }

      h2 {
        font-size: 15px;
      }

      .update {
        padding: 12px;
      }

      .fire-heading {
        gap: 10px;
      }

      .fire-name {
        font-size: 13px;
      }

      .updated {
        font-size: 11px;
      }

      .acreages {
        gap: 8px;
      }
    }

    @media (pointer: coarse) {

      .sort-order,
      .group-toggle {
        min-height: 44px;
      }

      .name-filter {
        font-size: 16px;
      }
    }

    @media print {
      :root {
        color-scheme: light;
      }

      main {
        padding: 16px 0;
      }

      .update {
        break-inside: avoid;
      }

      .sort-order {
        text-decoration: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .update {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main aria-label="Fire updates">
    <input id="name-filter" class="name-filter" type="search" aria-label="Filter fires by name"
      placeholder="Filter fires by name" autocomplete="off" disabled>
    <p id="load-status" class="empty" role="status">Loading updates…</p>
    <div id="update-groups"></div>
    <p id="sort-status" class="screen-reader" role="status"></p>
    <footer class="snapshot" hidden>
      As of
      <time></time>
    </footer>
  </main>
  <script>
    /** Keep one viewer alive while new snapshots and the browser clock update it. */
    function startPage(data) {
      let updates = [];
      const ranges = [
        { start: 0, end: 60, label: "0–60 minutes ago" },
        { start: 60, end: 240, label: "60 minutes–4 hours ago" },
        { start: 240, end: 720, label: "4–12 hours ago" },
        { start: 720, end: 1440, label: "12–24 hours ago" },
        { start: 1440, end: 2880, label: "24–48 hours ago" }
      ];
      const acreageFormat = new Intl.NumberFormat("en-US", {
        minimumFractionDigits: 1, maximumFractionDigits: 1
      });
      const dateFormat = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Los_Angeles", month: "short", day: "numeric",
        hour: "numeric", minute: "2-digit"
      });
      const nameOrder = new Intl.Collator("en-US", {
        sensitivity: "base", numeric: true
      });
      const orderings = ranges.map(() => "time");
      const recentWindowMilliseconds = 15 * 60 * 1000;
      let highlightsReady = false;
      let highlightTimer;
      let ageTimer;
      const entryCache = new Map();
      const layoutAnimations = new Set();
      const departingRows = new Set();
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      const notifyUpdate = createUpdateFavicon(reducedMotion);

      const snapshotFormat = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Los_Angeles", year: "numeric",
        month: "short", day: "numeric",
        hour: "numeric", minute: "2-digit", timeZoneName: "short"
      });

      /** Match complete records without collapsing repeated updates or duplicates. */
      function recordSignature(record) {
        return JSON.stringify([
          fireIdentity(record), record.identifier, record.name, record.location,
          Date.parse(record.timestamp),
          record.mapped_area.value, record.previous_mapped_area?.value ?? null
        ]);
      }

      /** Retain unchanged rows and controls while replacements join the live layout. */
      function replaceSnapshot(data, animate = true) {
        const previous = new Map();
        for (const update of updates) {
          const signature = recordSignature(update.record);
          if (!previous.has(signature)) previous.set(signature, []);
          previous.get(signature).push(update);
        }
        const additions = [];
        updates = data.updates.map(record => {
          const retained = previous.get(recordSignature(record))?.shift();
          if (retained) return retained;
          additions.push(record);
          return { record };
        });
        const snapshot = new Date(data.generated_at);
        const snapshotTime = document.querySelector(".snapshot time");
        snapshotTime.dateTime = snapshot.toISOString();
        snapshotTime.textContent = snapshotFormat.format(snapshot);
        renderUpdates(animate);
        const now = Date.now();
        if (additions.some(record => {
          const entry = entryCache.get(record);
          return entry && !entry.closest(".group-body").hidden &&
            isRecent(record.timestamp, now);
        })) notifyUpdate();
        const retained = new Set(updates.map(update => update.record));
        for (const record of entryCache.keys()) {
          if (!retained.has(record)) entryCache.delete(record);
        }
      }

      /** The browser clock controls freshness independently of the generation time. */
      function isRecent(timestamp, now) {
        const age = now - Date.parse(timestamp);
        return age >= 0 && age < recentWindowMilliseconds;
      }

      /** Recheck at the next expiry and fade existing rows without recreating them. */
      function refreshRecentHighlights() {
        clearTimeout(highlightTimer);
        const now = Date.now();
        let nextExpiry = Infinity;
        for (const entry of document.querySelectorAll(".update")) {
          const timestamp = entry.dataset.timestamp;
          const recent = isRecent(timestamp, now);
          entry.classList.toggle("recent", recent);
          if (recent) {
            nextExpiry = Math.min(nextExpiry,
              Date.parse(timestamp) + recentWindowMilliseconds - now);
          }
        }
        if (Number.isFinite(nextExpiry)) {
          highlightTimer = setTimeout(refreshRecentHighlights, nextExpiry + 1);
        }
      }

      /** Fit each location to the space left by its own fire name and timestamp. */
      function fitLocations() {
        for (const identity of document.querySelectorAll(".identity")) {
          if (!identity.getClientRects().length) continue;
          const location = identity.querySelector(".location");
          const name = identity.querySelector(".fire-name");
          location.hidden = false;
          location.textContent = location.dataset.full;
          const gap = parseFloat(getComputedStyle(identity).columnGap);
          const available =
            identity.getBoundingClientRect().width - name.scrollWidth - gap;
          if (location.getBoundingClientRect().width <= available) continue;
          location.textContent = location.dataset.state;
          location.hidden = !location.textContent ||
            location.getBoundingClientRect().width > available;
        }
      }

      /** Keep displayed text separate from markup, including names from the log. */
      function element(tag, className, text) {
        const result = document.createElement(tag);
        result.className = className;
        if (text !== undefined) result.textContent = text;
        return result;
      }

      /** Preserve identity across display-name changes and distinct same-named fires. */
      function fireIdentity(record) {
        return JSON.stringify(record.log_identity ?? (record.identifier ?
          ["id", record.identifier] : ["name", record.name]));
      }

      /**
       * The first hour uses a live minute count; older updates use their logged time.
       */
      function updateTime(entry, update) {
        const minutes = Math.floor(update.age);
        entry.querySelector("time").textContent = update.age < 60 ?
          `${minutes} ${minutes === 1 ? "minute" : "minutes"} ago` :
          dateFormat.format(new Date(update.record.timestamp));
      }

      /** Show each update alongside the immediately preceding logged acreage. */
      function fireEntry(update) {
        const cached = entryCache.get(update.record);
        if (cached) {
          updateTime(cached, update);
          return cached;
        }
        const entry = element("li", "update");
        const record = update.record;
        entry.dataset.timestamp = record.timestamp;
        const current = record.mapped_area.value;
        const previous = record.previous_mapped_area?.value;
        const difference = current - (previous ?? 0);
        const roundedDifference = Math.round(Math.abs(difference) * 10) / 10;
        const changeClass = difference > 0 ? "increase" : "decrease";
        const changeText = `${difference > 0 ? "+" : "−"}` +
          (roundedDifference === 0 ? "<0.1" : acreageFormat.format(roundedDifference));
        const heading = element("div", "fire-heading");
        const identity = element("div", "identity");
        const location = element("span", "location", record.location || "");
        location.dataset.full = record.location || "";
        location.dataset.state =
          (record.location || "").match(/,\s*([A-Z]{2})\s*$/)?.[1] || "";
        identity.append(element("h3", "fire-name", record.name), location);
        const updated = element("div", "updated");
        const time = element("time", "");
        time.dateTime = record.timestamp;
        updated.append(time);
        heading.append(identity, updated);
        const acreages = element("dl", "acreages");
        const values = [
          ["Previous acreage",
            previous === undefined ? "—" : acreageFormat.format(previous), ""],
          ["Change in acreage", changeText, changeClass],
          ["Current acreage", acreageFormat.format(current), "current"]
        ];
        for (const [label, value, className] of values) {
          const group = document.createElement("div");
          const quantity = element("dd", className, value);
          if (value === "—") {
            quantity.setAttribute("aria-label", "No previous log entry");
          }
          group.append(element("dt", "", label), quantity);
          acreages.append(group);
        }
        entry.append(heading, acreages);
        updateTime(entry, update);
        entryCache.set(record, entry);
        return entry;
      }

      /**
       * Each group can change order independently without discarding repeated fires.
       */
      function createGroup(range, index) {
        const section = element("section", "section");
        const heading = element("div", "section-heading");
        const title = element("h2", "");
        const toggle = element("button", "group-toggle", range.label);
        toggle.type = "button";
        toggle.setAttribute("aria-expanded", "true");
        title.append(toggle);
        title.id = `range-${index}`;
        section.setAttribute("aria-labelledby", title.id);
        const sortButton = element("button", "sort-order");
        sortButton.type = "button";
        const list = element("ol", "updates");
        list.id = `updates-${index}`;
        list.setAttribute("aria-labelledby", title.id);
        sortButton.setAttribute("aria-controls", list.id);

        sortButton.addEventListener("click", () => {
          orderings[index] = orderings[index] === "time" ? "name" : "time";
          renderUpdates(true);
          document.getElementById("sort-status").textContent =
            `${range.label}: ordered by ${orderings[index]}.`;
        });
        heading.append(title, sortButton);
        const body = element("div", "group-body");
        body.id = `group-body-${index}`;
        toggle.setAttribute("aria-controls", body.id);
        const surface = element("div", "group-surface");
        surface.setAttribute("aria-hidden", "true");
        body.append(surface, list);
        section.append(heading, body);
        const group = {
          section, heading, body, list, sortButton, toggle,
          collapsed: false
        };
        toggle.addEventListener("click", () => {
          group.collapsed = !group.collapsed;
          renderUpdates(true);
        });
        return group;
      }

      const nameFilter = document.getElementById("name-filter");
      const groups = ranges.map(createGroup);
      const noMatches = element("p", "empty", "No matching fires.");
      noMatches.hidden = true;
      document.getElementById("update-groups").append(
        ...groups.map(group => group.section), noMatches
      );

      /**
       * Keep existing rows and controls so live aging preserves focus and color fades.
       */
      function reconcileEntries(list, entries) {
        let position = list.firstElementChild;
        for (const entry of entries) {
          if (entry === position) {
            position = position.nextElementSibling;
          } else {
            list.insertBefore(entry, position);
          }
        }
        while (position) {
          const next = position.nextElementSibling;
          position.remove();
          position = next;
        }
      }

      /**
       * Hidden rows use their visible group header as a movement endpoint.
       */
      function captureLayout() {
        const positions = new Map();
        const selector = ".section, .group-surface, .update, .empty, .snapshot";
        for (const node of document.querySelectorAll(selector)) {
          const collapsed = node.classList.contains("update") &&
            node.closest(".group-body").hidden;
          const anchor = collapsed ?
            node.closest(".section").querySelector(".section-heading") : node;
          if (!anchor.getClientRects().length) continue;
          const styles = getComputedStyle(node);
          positions.set(node, {
            bounds: anchor.getBoundingClientRect(),
            collapsed,
            background: styles.backgroundColor,
            padding: styles.padding,
            borderTop: styles.borderTop
          });
        }
        return positions;
      }

      /** Cancel only layout motion, leaving the independent background fade intact. */
      function stopLayoutAnimations() {
        for (const animation of layoutAnimations) animation.cancel();
        layoutAnimations.clear();
        for (const row of departingRows) row.remove();
        departingRows.clear();
      }

      /**
       * Release completed effects so rapid sorting and filtering leave no stale state.
       */
      function animateLayoutNode(node, keyframes, duration, removeAfter = false) {
        const animation = node.animate(keyframes, {
          duration, easing: "cubic-bezier(0.22, 1, 0.36, 1)"
        });
        layoutAnimations.add(animation);
        const release = () => {
          layoutAnimations.delete(animation);
          if (removeAfter) {
            node.remove();
            departingRows.delete(node);
          }
        };
        animation.finished.then(release, release);
      }

      /**
       * Detached row copies can travel into a header without revealing its contents.
       */
      function departingRow(node, state) {
        const ghost = node.cloneNode(true);
        ghost.className = "departing-update";
        ghost.setAttribute("aria-hidden", "true");
        ghost.inert = true;
        Object.assign(ghost.style, {
          left: `${state.bounds.left + scrollX}px`,
          top: `${state.bounds.top + scrollY}px`,
          width: `${state.bounds.width}px`,
          height: `${state.bounds.height}px`,
          padding: state.padding,
          borderTop: state.borderTop,
          backgroundColor: state.background
        });
        document.body.append(ghost);
        departingRows.add(ghost);
        return ghost;
      }

      /** Keep row centers aligned as their outlines shrink into a closed header. */
      function headerTransform(source, destination) {
        const horizontal = destination.left + destination.width / 2 -
          source.left - source.width / 2;
        const vertical = destination.top + destination.height / 2 -
          source.top - source.height / 2;
        return {
          horizontal, vertical,
          scaleX: destination.width / source.width,
          scaleY: destination.height / source.height
        };
      }

      /**
       * Slide retained rows into place while expired rows fade over the closing gap.
       */
      function animateLayout(previous) {
        const current = captureLayout();
        for (const [node, state] of current) {
          const before = previous.get(node);
          if (state.collapsed) {
            if (before && !before.collapsed) {
              const motion = headerTransform(before.bounds, state.bounds);
              animateLayoutNode(departingRow(node, before), [
                { opacity: 1, transform: "translate(0, 0) scale(1, 1)" },
                {
                  opacity: 0,
                  transform: `translate(${motion.horizontal}px, ` +
                    `${motion.vertical}px) ` +
                    `scale(${motion.scaleX}, ${motion.scaleY})`
                }
              ], 1680, true);
            }
            continue;
          }
          if (!before) {
            if (node.classList.contains("update")) {
              animateLayoutNode(node, [
                { opacity: 0, transform: "translateY(6px)" },
                { opacity: 1, transform: "translateY(0)" }
              ], 1200);
            }
            continue;
          }
          let horizontal = before.bounds.left - state.bounds.left;
          let vertical = before.bounds.top - state.bounds.top;
          const emergence = before.collapsed ?
            headerTransform(state.bounds, before.bounds) : null;
          if (emergence) {
            horizontal = emergence.horizontal;
            vertical = emergence.vertical;
          }
          const section = node.closest(".section");
          if (section && section !== node &&
            previous.has(section) && current.has(section)) {
            horizontal -= previous.get(section).bounds.left -
              current.get(section).bounds.left;
            vertical -= previous.get(section).bounds.top -
              current.get(section).bounds.top;
          }
          if (emergence) {
            animateLayoutNode(node, [
              {
                opacity: 0,
                transform: `translate(${horizontal}px, ${vertical}px) ` +
                  `scale(${emergence.scaleX}, ${emergence.scaleY})`
              },
              { opacity: 1, transform: "translate(0, 0) scale(1, 1)" }
            ], 1680);
            continue;
          }
          const scale =
            node.classList.contains("group-surface") && state.bounds.height ?
              before.bounds.height / state.bounds.height : 1;
          if (Math.abs(horizontal) < 0.5 && Math.abs(vertical) < 0.5 &&
            Math.abs(scale - 1) < 0.001) continue;
          animateLayoutNode(node, [
            { transform: `translate(${horizontal}px, ${vertical}px) scaleY(${scale})` },
            { transform: "translate(0, 0) scaleY(1)" }
          ], 1680);
        }
        for (const [node, state] of previous) {
          if (!node.classList.contains("update") || state.collapsed ||
            current.has(node)) continue;
          const ghost = departingRow(node, state);
          animateLayoutNode(ghost, [
            { opacity: 1, transform: "translateY(0)" },
            { opacity: 0, transform: "translateY(-6px)" }
          ], 1200, true);
        }
      }

      /** Wake at the next displayed minute or bucket boundary, including 48 hours. */
      function scheduleAgeRefresh(now) {
        clearTimeout(ageTimer);
        let nextRefresh = Infinity;
        for (const update of updates) {
          const timestamp = Date.parse(update.record.timestamp);
          const age = (now - timestamp) / 60000;
          const range = ranges.find(range => age < range.end);
          if (!range) continue;
          const nextMinute = age < 60 ? Math.floor(age) + 1 : range.end;
          nextRefresh = Math.min(nextRefresh, timestamp + nextMinute * 60000 - now);
        }
        if (Number.isFinite(nextRefresh)) {
          ageTimer = setTimeout(
            () => renderUpdates(true), Math.max(0, nextRefresh) + 1);
        }
      }

      /**
       * Filter displayed updates without changing their historical acreage comparison.
       */
      function renderUpdates(animate = false) {
        const previousLayout = animate && !reducedMotion.matches && !document.hidden ?
          captureLayout() : null;
        stopLayoutAnimations();
        const now = Date.now();
        const query = nameFilter.value.toLocaleLowerCase("en-US");
        const matching = updates.map(update => ({
          ...update, age: (now - Date.parse(update.record.timestamp)) / 60000
        })).filter(update => update.age >= 0 && update.age < 2880 &&
          update.record.name.toLocaleLowerCase("en-US").includes(query));
        for (const [index, range] of ranges.entries()) {
          const group = groups[index];
          group.body.hidden = group.collapsed;
          group.toggle.setAttribute("aria-expanded", String(!group.collapsed));
          const sorted = matching.filter(update =>
            update.age >= range.start && update.age < range.end);
          sorted.sort((first, second) => {
            const names = nameOrder.compare(first.record.name, second.record.name);
            return (orderings[index] === "name" ? names : 0) || first.age - second.age;
          });
          const count = new Set(sorted.map(update => fireIdentity(update.record))).size;
          group.section.hidden = Boolean(query) && !sorted.length;
          const entries = sorted.map(fireEntry);
          if (!entries.length) {
            entries.push(element("li", "empty", "No updates in this time range."));
          }
          reconcileEntries(group.list, entries);
          group.sortButton.textContent =
            `${count} ${count === 1 ? "fire" : "fires"} ordered by ${orderings[index]}`;
        }
        noMatches.hidden = !query || matching.length > 0;
        fitLocations();
        if (highlightsReady) refreshRecentHighlights();
        if (previousLayout) animateLayout(previousLayout);
        document.getElementById("sort-status").textContent =
          `${matching.length} updates shown.`;
        scheduleAgeRefresh(now);
      }

      nameFilter.addEventListener("input", () => renderUpdates());
      const locationObserver = new ResizeObserver(fitLocations);
      locationObserver.observe(document.querySelector("main"));
      document.fonts.ready.then(fitLocations);
      document.querySelector(".snapshot").hidden = false;
      nameFilter.disabled = false;
      replaceSnapshot(data, false);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        highlightsReady = true;
        refreshRecentHighlights();
      }));
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) renderUpdates();
      });
      reducedMotion.addEventListener("change", stopLayoutAnimations);
      return replaceSnapshot;
    }

    /** Draw transient update notifications entirely in memory, including the blank icon. */
    function createUpdateFavicon(reducedMotion) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 32;
      const context = canvas.getContext("2d");
      const icon = document.createElement("link");
      icon.rel = "icon";
      icon.type = "image/png";
      let started;
      let timer;

      /** A transparent frame also clears browsers that retain removed favicon links. */
      function paint(strength, opacity) {
        context.clearRect(0, 0, 32, 32);
        context.fillStyle = `rgba(67, 154, 88, ${opacity})`;
        context.beginPath();
        context.arc(16, 16, 32 * (0.29 + 0.075 * strength), 0, Math.PI * 2);
        context.fill();
        icon.href = canvas.toDataURL("image/png");
      }

      /** Elapsed time keeps six pulses aligned even when background timers slow down. */
      function tick() {
        clearTimeout(timer);
        const elapsed = performance.now() - started;
        if (elapsed >= 30000) {
          paint(0, 0);
          started = undefined;
          return;
        }
        const strength = reducedMotion.matches ? 1 :
          (1 - Math.cos(elapsed / 5000 * Math.PI * 2)) / 2;
        paint(strength, 0.92 * strength);
        timer = setTimeout(tick, Math.min(100, 30000 - elapsed));
      }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && started !== undefined) tick();
      });

      /** Each qualifying snapshot starts a complete thirty-second notification. */
      return function notifyUpdate() {
        if (!icon.isConnected) document.head.append(icon);
        started = performance.now();
        tick();
      };
    }

    /** Reject malformed snapshots before any records are rendered. */
    function validateSnapshot(data) {
      const isAcreage = value => value && value.units === "acre" &&
        typeof value.value === "number" && Number.isFinite(value.value) &&
        value.value >= 0;
      const isTimestamp = value => typeof value === "string" &&
        Number.isFinite(Date.parse(value));
      const isIdentity = value => value == null || (Array.isArray(value) &&
        value.length === 2 && ["id", "name", "local"].includes(value[0]) &&
        typeof value[1] === "string");
      if (!data || data.version !== 1 || !isTimestamp(data.generated_at) ||
        !Array.isArray(data.updates)) {
        throw new Error("Invalid update snapshot.");
      }
      for (const record of data.updates) {
        if (!record || typeof record.name !== "string" ||
          !(record.identifier === null || typeof record.identifier === "string") ||
          !isIdentity(record.log_identity) ||
          !(record.location === null || typeof record.location === "string") ||
          !isTimestamp(record.timestamp) || !isAcreage(record.mapped_area) ||
          !(record.previous_mapped_area === null ||
            isAcreage(record.previous_mapped_area))) {
          throw new Error("Invalid fire update.");
        }
      }
      return data;
    }

    /** Compare server validators from the last successfully displayed download. */
    function responseVersion(response) {
      return {
        etag: response.headers.get("ETag"),
        modified: response.headers.get("Last-Modified"),
        length: response.headers.get("Content-Length")
      };
    }

    /** Metadata can collide, so only a strong ETag permits indefinite reuse. */
    function sameVersion(previous, current, allowWeak) {
      if (!previous) return false;
      if (previous.etag || current.etag) {
        return Boolean(previous.etag && previous.etag === current.etag &&
          (!current.etag.startsWith("W/") || allowWeak));
      }
      return Boolean(allowWeak && previous.modified && current.modified &&
        previous.length && current.length &&
        previous.modified === current.modified && previous.length === current.length);
    }

    /** Bound network waits so a stalled request cannot block later refreshes. */
    function requestSnapshot(method) {
      return fetch("./updates.json", {
        method, cache: "no-store", signal: AbortSignal.timeout(15000)
      });
    }

    let replaceSnapshot;
    let downloadedVersion;
    let downloadedAt = -Infinity;
    let loading = false;
    const metadataRecheckMilliseconds = 5 * 60000;

    /** Check metadata before downloading and animate only validated replacements. */
    async function loadUpdates(checkFirst = true) {
      if (loading) return;
      loading = true;
      const status = document.getElementById("load-status");
      try {
        if (checkFirst) {
          const head = await requestSnapshot("HEAD");
          if (head.ok || head.status === 304) {
            const allowWeak =
              performance.now() - downloadedAt < metadataRecheckMilliseconds;
            if (sameVersion(downloadedVersion, responseVersion(head), allowWeak)) {
              return;
            }
          } else if (head.status !== 405 && head.status !== 501) {
            throw new Error(`HEAD HTTP ${head.status}`);
          }
        }
        const response = await requestSnapshot("GET");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = validateSnapshot(await response.json());
        if (replaceSnapshot) {
          replaceSnapshot(data);
        } else {
          replaceSnapshot = startPage(data);
        }
        downloadedVersion = responseVersion(response);
        downloadedAt = performance.now();
        status.hidden = true;
      } catch (error) {
        if (!replaceSnapshot) {
          status.setAttribute("role", "alert");
          status.textContent = "Unable to load updates.json.";
        }
        console.error(error);
      } finally {
        loading = false;
      }
    }

    loadUpdates(false);
    setInterval(loadUpdates, 30000);
  </script>
</body>
