<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="426" viewBox="0 0 840 426" role="img" aria-labelledby="title description" style="max-width:100%;height:auto">
  <title id="title">Incremental candidates cover different omissions</title>
  <desc id="description">Three independent ID queries feed a union before exact feature comparison. The inputs follow the sorted result order, and each arrow points to the ID its query contributes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"/>
  </marker>
    <style>
      :root { color-scheme: light dark; --bg:#111820; --text:#e4edf5; --muted:#acbdcb; --edge:#9caebe; --blue:#172c3e; --green:#1b3025; --gold:#362c1c; --purple:#2b253e; --accent:#7bdfdf; }
      @media (prefers-color-scheme: light) { :root { --bg:#fbfcfe; --text:#172e40; --muted:#526779; --edge:#526779; --blue:#eaf3fc; --green:#ecf7ee; --gold:#fff7e8; --purple:#f0edfa; --accent:#197685; } }
      text { font-family:system-ui,sans-serif; font-size:16px; fill:var(--text); }
      .title { font-size:21px; font-weight:700; }
      .heading { font-size:18px; font-weight:650; }
      .muted { fill:var(--muted); }
      .card { stroke:var(--edge); stroke-width:1.5; rx:12; }
      .edge { fill:none; stroke:var(--edge); stroke-width:2; marker-end:url(#arrow); }
      .axis { stroke:var(--edge); stroke-width:2; fill:none; }
      .accent { stroke:var(--accent); stroke-width:4; fill:none; }
    </style>
  </defs>
  <rect width="840" height="426" fill="var(--bg)"/>
  <text x="28" y="36" class="title" text-anchor="start">Incremental candidates cover different omissions</text>
  <g id="status-flips">
<rect x="28" y="70" width="244" height="128" fill="var(--gold)" class="card "/>
<text x="46" y="99" class="heading" text-anchor="start">Status flips</text>
<text x="46" y="127" class="" text-anchor="start">Active → inactive: {1}</text>
<text x="46" y="150" class="" text-anchor="start">Timestamp may stay old</text>
</g>
  <path id="status-union" d="M 150 198 V 216 L 424.76 234 V 249" class="edge"/>
  <g id="changed-ids">
<rect x="298" y="70" width="244" height="128" fill="var(--purple)" class="card "/>
<text x="316" y="99" class="heading" text-anchor="start">Changed IDs</text>
<text x="316" y="127" class="" text-anchor="start">Timestamp query: {2}</text>
<text x="316" y="150" class="" text-anchor="start">Known row edited</text>
</g>
  <path id="changed-union" d="M 420 198 V 216 L 444.02 234 V 249" class="edge"/>
  <g id="missing-ids">
<rect x="568" y="70" width="244" height="128" fill="var(--blue)" class="card "/>
<text x="586" y="99" class="heading" text-anchor="start">Missing IDs</text>
<text x="586" y="127" class="" text-anchor="start">Live − stored: {3}</text>
<text x="586" y="150" class="" text-anchor="start">Old timestamp, new ID</text>
</g>
  <path id="missing-union" d="M 690 198 V 216 L 464.93 234 V 249" class="edge"/>
  <g id="union">
<rect x="188" y="254" width="464" height="104" fill="var(--green)" class="card "/>
<text x="206" y="283" class="heading" text-anchor="start">Sorted candidate union: {<tspan id="status-id">1</tspan>, <tspan id="changed-id">2</tspan>, <tspan id="missing-id">3</tspan>}</text>
<text x="206" y="311" class="" text-anchor="start">Fetch features, then compare actual rows.</text>
</g>
  <text x="28" y="397" class="muted" text-anchor="start">No one query supplies a transactionally complete provider snapshot.</text>
</svg>
