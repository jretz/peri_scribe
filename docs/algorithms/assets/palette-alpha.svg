<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="palette-alpha-title palette-alpha-description" style="max-width:100%;height:auto">
  <title id="palette-alpha-title">Measure compositing error on both light and dark</title>
  <desc id="palette-alpha-description">A half-alpha red pixel appears dark red on black and pale red on white. Straight RGB alone cannot distinguish it from opaque red.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--edge)" />
    </marker>
    <style>
    :root { color-scheme: light dark; --background:#fbfcfe; --text:#172e40;
      --muted:#526779; --edge:#526779; --blue:#eaf3fc; --blue-line:#5791bf;
      --amber:#fff7e8; --amber-line:#c69a46; --purple:#f0edfa; --purple-line:#9481c6; }
    @media (prefers-color-scheme:dark) {
      :root { --background:#111820; --text:#e4edf5; --muted:#acbdcb; --edge:#9caebe;
        --blue:#172c3e; --blue-line:#6198c2; --amber:#362c1c; --amber-line:#c4a45f;
        --purple:#2b253e; --purple-line:#a391d0; }
    }
    text { font-family:system-ui,sans-serif; font-size:16px; fill:var(--text); }
    .heading { font-size:20px; font-weight:700; }
    .label { font-weight:650; }
    .muted { fill:var(--muted); }
    .blue { fill:var(--blue); stroke:var(--blue-line); }
    .amber { fill:var(--amber); stroke:var(--amber-line); }
    .purple { fill:var(--purple); stroke:var(--purple-line); }
    .box { stroke-width:2; rx:12; }
    .edge { fill:none; stroke:var(--edge); stroke-width:2; marker-end:url(#arrow); }
    .line { fill:none; stroke:var(--edge); stroke-width:2; }
    .dash { stroke-dasharray:6 5; }
    .point { fill:var(--text); }
</style>
  </defs>
  <rect width="840" height="420" fill="var(--background)" />
  <text x="24" y="34" class="heading">Measure compositing error on both light and dark</text>
  <g id="black-background">
    <rect x="40" y="81" width="344" height="166" rx="12" fill="#000" />
    <rect x="65" y="111" width="110" height="104" fill="#ff0000" />
    <rect x="217" y="111" width="110" height="104" fill="#800000" />
    <text x="46" y="278" class="">Opaque red</text>
    <text x="215" y="278" class="">Half-alpha red</text>
  </g>
  <g id="white-background">
    <rect x="453" y="81" width="344" height="166" rx="12" fill="#fff" stroke="var(--edge)" />
    <rect x="480" y="111" width="110" height="104" fill="#ff0000" />
    <rect x="631" y="111" width="110" height="104" fill="#ff7f7f" />
    <text x="460" y="278" class="">Opaque red</text>
    <text x="628" y="278" class="">Half-alpha red</text>
  </g>
  <g id="metric">
    <rect class="box amber" x="24" y="321" width="786" height="80" />
    <text x="40" y="350" class="label">Feature distance = average squared error on black and white</text>
    <text x="40" y="380" class="">Premultiplied color plus weighted opacity makes invisible RGB differences irrelevant.</text>
  </g>
</svg>