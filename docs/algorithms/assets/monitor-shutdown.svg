<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="510"
     viewBox="0 0 840 510" role="img" aria-labelledby="figure-title figure-description"
     style="max-width:100%;height:auto">
  <title id="figure-title">Stop publication before waiting for descriptor users</title>
  <desc id="figure-description">Unmount first stops admission and publication, then signals reader stop and waits asynchronously for admitted work. Descriptors close only after the active operation settles. Late work cannot publish a new result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8"
            markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="var(--edge)"/>
    </marker>
    <style>
    :root { color-scheme:light dark; --background:#111820; --text:#e4edf5;
      --muted:#acbdcb; --edge:#9caebe; --disk:#172c3e; --disk-border:#6198c2;
      --process:#362c1c; --process-border:#c4a45f; --network:#2b253e;
      --network-border:#a391d0; }
    @media (prefers-color-scheme:light) { :root { --background:#fbfcfe;
      --text:#172e40; --muted:#526779; --edge:#526779; --disk:#eaf3fc;
      --disk-border:#5791bf; --process:#fff7e8; --process-border:#c69a46;
      --network:#f0edfa; --network-border:#9481c6; } }
    svg { background:var(--background); }
    text { fill:var(--text); font-family:system-ui,sans-serif; font-size:17px; }
    .title { font-size:23px; font-weight:700; }
    .heading { font-size:18px; font-weight:700; }
    .muted { fill:var(--muted); font-size:16px; }
    .disk { fill:var(--disk); stroke:var(--disk-border); }
    .process { fill:var(--process); stroke:var(--process-border); }
    .network { fill:var(--network); stroke:var(--network-border); }
    .node { stroke-width:2; rx:12; }
    .edge { stroke:var(--edge); stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    .line { stroke:var(--edge); stroke-width:2; fill:none; }
    .dashed { stroke-dasharray:7 5; }
    </style>
  </defs>
  <rect width="840" height="510" fill="var(--background)"/>
  <text x="24" y="38" class="title">Stop publication before waiting for descriptor users</text>
  <g id="admitted">
<rect x="24" y="76" width="372" height="118" class="node process"/>
<text x="40" y="105" class="heading">Admitted operation</text>
<text x="40" y="134" class="">Snapshot → worker → publication</text>
<text x="40" y="160" class="">Owns the monitor operation lock</text>
</g>
<g id="stop">
<rect x="444" y="76" width="372" height="118" class="node network"/>
<text x="460" y="105" class="heading">Unmount begins</text>
<text x="460" y="134" class="">Set stop barrier immediately</text>
<text x="460" y="160" class="">Signal health reader stop event</text>
</g>
<path id="stop-wait" class="edge " d="M630 194 V256"/>
<g id="wait">
<rect x="444" y="256" width="372" height="118" class="node process"/>
<text x="460" y="285" class="heading">Wait asynchronously</text>
<text x="460" y="314" class="">Admitted operation settles</text>
<text x="460" y="340" class="">Late result cannot publish</text>
</g>
<path id="active-settles" class="edge " d="M210 194 V314 H444"/>
<path id="wait-close" class="edge " d="M630 374 V440 H396"/>
<g id="closed">
<rect x="24" y="400" width="372" height="82" class="node disk"/>
<text x="40" y="429" class="heading">Close readers once</text>
<text x="40" y="458" class="">Mark closed only after success.</text>
</g>
<text x="444" y="466" class="muted">Repeated cancellation still waits.</text>
</svg>
