<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="progression-icon-title progression-icon-description" style="max-width:100%;height:auto">
  <title id="progression-icon-title">Coverage controls alpha; covered samples control RGB</title>
  <desc id="progression-icon-description">A schematic pixel has four covered red samples out of sixteen. RGB remains full red while alpha becomes 64. This avoids darkening the edge twice.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--edge)" />
    </marker>
    <style>
    :root { color-scheme: light dark; --background:#111820; --text:#e4edf5;
      --muted:#acbdcb; --edge:#9caebe; --blue:#172c3e; --blue-line:#6198c2;
      --amber:#362c1c; --amber-line:#c4a45f; --purple:#2b253e; --purple-line:#a391d0; }
    @media (prefers-color-scheme:light) {
      :root { --background:#fbfcfe; --text:#172e40; --muted:#526779; --edge:#526779;
        --blue:#eaf3fc; --blue-line:#5791bf; --amber:#fff7e8; --amber-line:#c69a46;
        --purple:#f0edfa; --purple-line:#9481c6; }
    }
    text { font-family:system-ui,sans-serif; font-size:16px; fill:var(--text); }
    .heading { font-size:20px; font-weight:700; }
    .label { font-weight:650; }
    .muted { fill:var(--muted); }
    .blue { fill:var(--blue); stroke:var(--blue-line); }
    .amber { fill:var(--amber); stroke:var(--amber-line); }
    .purple { fill:var(--purple); stroke:var(--purple-line); }
    .box { stroke-width:2; rx:12; }
    .edge { fill:none; stroke:var(--edge); stroke-width:2; marker-end:url(#arrow); }
    .line { fill:none; stroke:var(--edge); stroke-width:2; }
    .dash { stroke-dasharray:6 5; }
    .point { fill:var(--text); }
</style>
  </defs>
  <rect width="840" height="420" fill="var(--background)" />
  <text x="24" y="34" class="heading">Coverage controls alpha; covered samples control RGB</text>
  <text x="45" y="83" class="label">One pixel: 4 × 4 samples</text>
  <rect id="sample-0-0" x="62" y="111" width="40" height="40" fill="#ff0000" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-0-1" x="102" y="111" width="40" height="40" fill="#ff0000" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-0-2" x="142" y="111" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-0-3" x="182" y="111" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-1-0" x="62" y="151" width="40" height="40" fill="#ff0000" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-1-1" x="102" y="151" width="40" height="40" fill="#ff0000" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-1-2" x="142" y="151" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-1-3" x="182" y="151" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-2-0" x="62" y="191" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-2-1" x="102" y="191" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-2-2" x="142" y="191" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-2-3" x="182" y="191" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-3-0" x="62" y="231" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-3-1" x="102" y="231" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-3-2" x="142" y="231" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <rect id="sample-3-3" x="182" y="231" width="40" height="40" fill="var(--background)" stroke="var(--edge)" stroke-width="1" />
  <text x="49" y="307" class="">4 red samples; 12 uncovered</text>
  <g id="coverage">
    <rect class="box blue" x="337" y="68" width="473" height="123" />
    <text x="353" y="97" class="label">Coverage gives opacity</text>
    <text x="353" y="127" class="">C = 4; S² = 16; coverage = 1/4</text>
    <text x="353" y="152" class="">Alpha = round(255 × 1/4) = 64</text>
    <text x="353" y="177" class="">Production uses 16 × 16 subpixels.</text>
  </g>
  <g id="straight-alpha">
    <rect class="box amber" x="337" y="224" width="473" height="123" />
    <text x="353" y="253" class="label">Divide RGB by covered samples</text>
    <text x="353" y="283" class="">Red = (4 × 255) / 4 = 255</text>
    <text x="353" y="308" class="">Stored output pixel = (255, 0, 0, 64)</text>
    <text x="353" y="333" class="">The viewer applies opacity when compositing.</text>
  </g>
  <path id="samples-to-rgba" class="edge" d="M237 203 H285 V281 H332" />
  <text x="24" y="389" class="muted">Dividing RGB by all samples would darken the stored color before compositing.</text>
</svg>