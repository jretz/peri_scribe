<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="672" viewBox="0 0 840 672"
     role="img" aria-labelledby="title description" style="max-width:100%;height:auto">
  <title id="title">Copy a shared prefix before changing either continuation</title>
  <desc id="description">The retained result of A includes durable files and the full compatible
    model matcher. Two copies separate into private directories for B and C. B appends its
    own result and advances its matcher, while the original and C's starting state stay
    unchanged. Two static branch diagrams show the states before and after B runs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"/>
    </marker>
    <style>
      :root { color-scheme:light dark; --bg:#fbfcfe; --text:#172e40;
        --muted:#526779; --edge:#526779; --blue:#eaf3fc; --green:#ecf7ee;
        --purple:#f0edfa; --accent:#24764c; --change:#326caf; --line:#bac7d1; }
      @media (prefers-color-scheme:dark) {
        :root { --bg:#111820; --text:#e4edf5; --muted:#acbdcb; --edge:#9caebe;
          --blue:#172c3e; --green:#1b3025; --purple:#2b253e;
          --accent:#76c89a; --change:#86b9f5; --line:#50616e; }
      }
      text { font-family:system-ui,sans-serif; font-size:16px; fill:var(--text); }
      .title { font-size:21px; font-weight:700; }
      .heading { font-size:17px; font-weight:650; }
      .small { font-size:14px; }
      .muted { fill:var(--muted); }
      .packet { fill:var(--purple); stroke:var(--edge); stroke-width:1.5; }
      .directory { fill:none; stroke:var(--line); stroke-width:1.5; stroke-dasharray:6 5; }
      .file { fill:var(--bg); stroke:var(--edge); stroke-width:1.5; }
      .retained { stroke:var(--accent); stroke-width:5; }
      .changed { stroke:var(--change); stroke-width:5; }
      .edge { fill:none; stroke:var(--edge); stroke-width:1.5; marker-end:url(#arrow); }
      #copy-b { transform:translate(96px,288px); }
      #copy-c { transform:translate(504px,288px); }
      #b-before { opacity:0; }
      #b-after { opacity:1; }
      #b-appended-line { transform:scaleX(1); }
      .motion-label { display:none; }
      @media (prefers-reduced-motion:no-preference) {
        #copy-b { animation:copy-b 20s linear infinite; }
        #copy-c { animation:copy-c 20s linear infinite; }
        #b-before { animation:before-b 20s linear infinite; }
        #b-after { animation:after-b 20s linear infinite; }
        #b-appended-line { animation:append-b 20s linear infinite; }
        .motion-label { display:inline; }
        .static-label { display:none; }
      }
      /* 0–2s: retain A. 2–6s: separate both copies. 6–9s: compare equal
         starts. 9–11s: B changes its own files/matcher. 11–17s: hold the
         independent outcomes. 17–20s: fade copies, then reset this example.
         Displaying both copies together explains isolation, not scheduling;
         the concrete depth-first replay can create and visit them in turn. */
      @keyframes copy-b {
        0%,10% { transform:translate(300px,98px); opacity:0; }
        12% { transform:translate(300px,98px); opacity:1; }
        30%,85% { transform:translate(96px,288px); opacity:1; }
        92%,100% { transform:translate(96px,288px); opacity:0; }
      }
      @keyframes copy-c {
        0%,10% { transform:translate(300px,98px); opacity:0; }
        12% { transform:translate(300px,98px); opacity:1; }
        30%,85% { transform:translate(504px,288px); opacity:1; }
        92%,100% { transform:translate(504px,288px); opacity:0; }
      }
      @keyframes before-b {
        0%,45% { opacity:1; }
        47%,100% { opacity:0; }
      }
      @keyframes after-b {
        0%,45% { opacity:0; }
        47%,100% { opacity:1; }
      }
      @keyframes append-b {
        0%,45% { transform:scaleX(0); }
        55%,100% { transform:scaleX(1); }
      }
    </style>
    <!-- A packet stands for all copied files and the complete surviving matcher,
         not one filename or a reconstruction from a visible model projection. -->
    <g id="prefix-packet">
      <rect width="240" height="110" rx="10" class="packet"/>
      <path d="M 18 17 H 59 L 74 32 V 94 H 18 Z M 59 17 V 32 H 74" class="file"/>
      <path d="M 29 46 H 62 M 29 58 H 62" class="retained"/>
      <text x="89" y="28" class="small muted">Durable files</text>
      <text x="89" y="54" class="heading">A</text>
      <text x="89" y="86">Matcher M_A</text>
    </g>
    <g id="small-a">
      <rect width="114" height="35" rx="7" class="packet"/>
      <text x="57" y="23" text-anchor="middle" class="small">Files A</text>
    </g>
  </defs>
  <rect width="840" height="672" fill="var(--bg)"/>
  <text x="24" y="35" class="title">Copy a shared prefix before changing either continuation</text>
  <text x="24" y="63" class="muted">File contents can diverge; the shared prefix stays unchanged.</text>
  <text x="420" y="88" text-anchor="middle" class="heading">Retained result of A</text>
  <use id="retained-a" href="#prefix-packet" x="300" y="98"/>
  <path d="M 350 208 L 217 249" class="edge"/>
  <path d="M 490 208 L 623 249" class="edge"/>
  <rect x="28" y="249" width="378" height="178" rx="12" class="directory"/>
  <rect x="434" y="249" width="378" height="178" rx="12" class="directory"/>
  <text x="46" y="419" class="heading">B’s private directory</text>
  <text x="452" y="419" class="heading">C’s private starting directory</text>
  <g id="copy-b">
    <use href="#prefix-packet"/>
    <g id="b-before">
      <rect x="85" y="34" width="140" height="62" fill="var(--purple)"/>
      <text x="89" y="54" class="heading">A</text>
      <text x="89" y="86">Matcher M_A</text>
    </g>
    <g id="b-after">
      <rect x="85" y="34" width="140" height="62" fill="var(--purple)"/>
      <text x="89" y="54" class="heading">A, B</text>
      <text x="89" y="86">Matcher M_AB</text>
      <g transform="translate(29 0)">
        <path id="b-appended-line" d="M 0 73 H 33" class="changed"/>
      </g>
    </g>
  </g>
  <g id="copy-c"><use href="#prefix-packet"/></g>
  <text x="24" y="453" class="muted motion-label">Copies separate → B writes privately → hold the independent states → replay.</text>
  <text x="24" y="453" class="muted static-label">After B writes: only B’s files and full matcher have advanced.</text>

  <!-- Always-visible branch states preserve both the copied intermediate and
       the changed result in image viewers without animation or with reduced motion. -->
  <path d="M 24 474 H 816" stroke="var(--line)"/>
  <text x="217" y="502" class="heading" text-anchor="middle">Copies before B runs</text>
  <text x="623" y="502" class="heading" text-anchor="middle">After B runs; C has not run yet</text>
  <use href="#small-a" x="160" y="515"/>
  <use href="#small-a" x="566" y="515"/>
  <path d="M 188 550 L 119 579 M 245 550 L 314 579" class="edge"/>
  <path d="M 594 550 L 525 579 M 651 550 L 720 579" class="edge"/>
  <use href="#small-a" x="62" y="581"/>
  <use href="#small-a" x="257" y="581"/>
  <g id="static-b-changed">
    <rect x="468" y="581" width="114" height="35" rx="7"
          fill="var(--blue)" stroke="var(--change)" stroke-width="1.5"/>
    <text x="525" y="604" text-anchor="middle" class="small">Files A, B</text>
  </g>
  <use href="#small-a" x="663" y="581"/>
  <text x="119" y="638" class="small" text-anchor="middle">B: M_A</text>
  <text x="314" y="638" class="small" text-anchor="middle">C: M_A</text>
  <text x="525" y="638" class="small" text-anchor="middle">B: M_AB</text>
  <text x="720" y="638" class="small" text-anchor="middle">C: M_A</text>
</svg>
