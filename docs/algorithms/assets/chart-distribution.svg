<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="424" viewBox="0 0 840 424" role="img" aria-labelledby="title description" style="max-width:100%;height:auto">
  <title id="title">A CCDF retains duplicate sample weight</title>
  <desc id="description">The maximum-value zero share is excluded before logarithmic fitting.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"/>
  </marker>
    <style>
      :root { color-scheme: light dark; --bg:#111820; --text:#e4edf5; --muted:#acbdcb; --edge:#9caebe; --blue:#172c3e; --green:#1b3025; --gold:#362c1c; --purple:#2b253e; --accent:#7bdfdf; }
      @media (prefers-color-scheme: light) { :root { --bg:#fbfcfe; --text:#172e40; --muted:#526779; --edge:#526779; --blue:#eaf3fc; --green:#ecf7ee; --gold:#fff7e8; --purple:#f0edfa; --accent:#197685; } }
      text { font-family:system-ui,sans-serif; font-size:16px; fill:var(--text); }
      .title { font-size:21px; font-weight:700; }
      .heading { font-size:18px; font-weight:650; }
      .muted { fill:var(--muted); }
      .card { stroke:var(--edge); stroke-width:1.5; rx:12; }
      .edge { fill:none; stroke:var(--edge); stroke-width:2; marker-end:url(#arrow); }
      .axis { stroke:var(--edge); stroke-width:2; fill:none; }
      .accent { stroke:var(--accent); stroke-width:4; fill:none; }
    </style>
  </defs>
  <rect width="840" height="424" fill="var(--bg)"/>
  <text x="28" y="36" class="title" text-anchor="start">A CCDF retains duplicate sample weight</text>
  <path d="M 90 310 H 550 M 90 310 V 72" class="axis"/>
  <path d="M 160 119 L 295 234" class="accent"/>
  <circle cx="160" cy="119" r="6" fill="var(--accent)"/>
  <circle cx="295" cy="234" r="6" fill="var(--accent)"/>
  <text x="171" y="110" class="" text-anchor="start">(1, 0.75)</text>
  <text x="307" y="231" class="" text-anchor="start">(2, 0.25)</text>
  <text x="120" y="349" class="" text-anchor="start">Value</text>
  <text x="99" y="70" class="" text-anchor="start">Share exceeding x (log scale)</text>
  <g id="samples">
<rect x="584" y="89" width="228" height="151" fill="var(--blue)" class="card "/>
<text x="602" y="118" class="heading" text-anchor="start">Samples: 1, 2, 2, 4</text>
<text x="602" y="146" class="" text-anchor="start">At 1: 3/4 exceed.</text>
<text x="602" y="169" class="" text-anchor="start">At 2: 1/4 exceed.</text>
<text x="602" y="192" class="" text-anchor="start">At 4: 0/4; omit.</text>
</g>
  <text x="28" y="393" class="muted" text-anchor="start">Knees fit three lines to (value, log10 share), over enumerated breakpoints.</text>
</svg>
