<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="geodesic-rings-title geodesic-rings-description" style="max-width:100%;height:auto">
  <title id="geodesic-rings-title">Area and exterior perimeter use different ring contributions</title>
  <desc id="geodesic-rings-description">An irregular fire perimeter encloses an unburned island. The outer ring adds area and contributes length. The island's interior ring subtracts area but contributes no exterior perimeter. Separate parts add.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--edge)" />
    </marker>
    <style>
    :root { color-scheme: light dark; --background:#111820; --text:#e4edf5;
      --muted:#acbdcb; --edge:#9caebe; --blue:#172c3e; --blue-line:#6198c2;
      --amber:#362c1c; --amber-line:#c4a45f; --purple:#2b253e; --purple-line:#a391d0; }
    @media (prefers-color-scheme:light) {
      :root { --background:#fbfcfe; --text:#172e40; --muted:#526779; --edge:#526779;
        --blue:#eaf3fc; --blue-line:#5791bf; --amber:#fff7e8; --amber-line:#c69a46;
        --purple:#f0edfa; --purple-line:#9481c6; }
    }
    text { font-family:system-ui,sans-serif; font-size:16px; fill:var(--text); }
    .heading { font-size:20px; font-weight:700; }
    .label { font-weight:650; }
    .muted { fill:var(--muted); }
    .blue { fill:var(--blue); stroke:var(--blue-line); }
    .amber { fill:var(--amber); stroke:var(--amber-line); }
    .purple { fill:var(--purple); stroke:var(--purple-line); }
    .box { stroke-width:2; rx:12; }
    .edge { fill:none; stroke:var(--edge); stroke-width:2; marker-end:url(#arrow); }
    .line { fill:none; stroke:var(--edge); stroke-width:2; }
    .dash { stroke-dasharray:6 5; }
    .point { fill:var(--text); }
</style>
  </defs>
  <rect width="840" height="420" fill="var(--background)" />
  <text x="24" y="34" class="heading">Area and exterior perimeter use different ring contributions</text>
  <g id="measured-rings">
    <path id="fire-perimeter" class="blue" stroke-width="5"
          d="M52 224 L66 191 L60 164 L81 134 L117 123 L138 96 L169 106
             L180 126 L218 115 L242 137 L239 164 L269 188 L264 220
             L277 245 L249 266 L233 297 L200 306 L176 292 L148 305
             L123 285 L94 289 L82 264 L58 252 Z" />
    <path id="unburned-island" fill="var(--background)" stroke="var(--amber-line)"
          stroke-width="3"
          d="M116 198 L124 174 L148 164 L174 174 L192 184 L188 207
             L166 215 L153 236 L128 228 L119 214 Z" />
    <text x="106" y="337" class="label">Fire perimeter</text>
    <text x="77" y="359">with an unburned island</text>
  </g>
  <g id="area">
    <rect class="box blue" x="345" y="70" width="465" height="112" />
    <text x="361" y="99" class="label">Geodesic area, square meters</text>
    <text x="361" y="129" class="">Orient rings consistently.</text>
    <text x="361" y="154" class="">Outer area − hole area; add separate parts.</text>
  </g>
  <g id="length">
    <rect class="box amber" x="345" y="211" width="465" height="112" />
    <text x="361" y="240" class="label">Exterior perimeter, meters</text>
    <text x="361" y="270" class="">Trace outer rings only.</text>
    <text x="361" y="295" class="">Holes do not increase exterior perimeter.</text>
  </g>
  <text x="24" y="385" class="muted">WGS84 surface measurements use the shared unit registry; Z is not terrain distance.</text>
</svg>
