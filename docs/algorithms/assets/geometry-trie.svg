<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="844"
     viewBox="0 0 840 844" role="img" aria-labelledby="figure-title figure-description"
     style="max-width:100%;height:auto">
  <title id="figure-title">Insertion changes the root, not the retained subtree</title>
  <desc id="figure-description">A saved snapshot and current pool root initially reference
    the same split-bit-1 subtree containing 0010 and 0011. Inserting 1010 builds a new
    split-bit-4 parent and a new leaf. Only after those children are linked does the current
    pool root switch to the new parent. The saved snapshot and original nodes never move
    or change. Three static graph states show before, built, and published states.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--edge)"/>
    </marker>
    <style>
    :root { color-scheme:light dark; --background:#111820; --text:#e4edf5;
      --muted:#acbdcb; --edge:#9caebe; --blue:#172c3e; --blue-line:#6198c2;
      --gold:#362c1c; --gold-line:#c4a45f; --purple:#2b253e;
      --purple-line:#a391d0; }
    @media (prefers-color-scheme:light) {
      :root { --background:#fbfcfe; --text:#172e40; --muted:#526779;
        --edge:#526779; --blue:#eaf3fc; --blue-line:#5791bf;
        --gold:#fff7e8; --gold-line:#c69a46; --purple:#f0edfa;
        --purple-line:#9481c6; }
    }
    text { font-family:system-ui,sans-serif; font-size:17px; fill:var(--text); }
    .heading { font-size:22px; font-weight:700; }
    .label { font-weight:650; }
    .small { font-size:16px; }
    .muted { fill:var(--muted); }
    .blue { fill:var(--blue); stroke:var(--blue-line); }
    .gold { fill:var(--gold); stroke:var(--gold-line); }
    .purple { fill:var(--purple); stroke:var(--purple-line); }
    .box { stroke-width:2; rx:10; }
    .edge { fill:none; stroke:var(--edge); stroke-width:2; marker-end:url(#arrow); }
    .line { fill:none; stroke:var(--edge); stroke-width:2; }
    .frame { fill:none; stroke:var(--edge); stroke-width:1; stroke-dasharray:5 5; }

    #current-before { opacity:0; }
    #new-parent { transform:translateY(0); }
    #incoming-leaf { transform:translateY(0); }
    @media (prefers-reduced-motion:no-preference) {
      #new-parent { animation:parent-build 20s linear infinite; }
      #incoming-leaf { animation:leaf-build 20s linear infinite; }
      #new-links { animation:children-connect 20s linear infinite; }
      #current-before { animation:before-publication 20s steps(1,end) infinite; }
      #current-after { animation:after-publication 20s steps(1,end) infinite; }
      #build-caption { animation:before-publication 20s steps(1,end) infinite; }
      #published-caption { animation:after-publication 20s steps(1,end) infinite; }
    }
    @keyframes parent-build {
      0%,15% { opacity:0; transform:translateY(110px); }
      16% { opacity:1; transform:translateY(110px); }
      30%,89% { opacity:1; transform:translateY(0); }
      94%,100% { opacity:0; transform:translateY(0); }
    }
    @keyframes leaf-build {
      0%,15% { opacity:0; transform:translateY(-116px); }
      16% { opacity:1; transform:translateY(-116px); }
      30%,89% { opacity:1; transform:translateY(0); }
      94%,100% { opacity:0; transform:translateY(0); }
    }
    @keyframes children-connect {
      0%,30% { opacity:0; } 32%,89% { opacity:1; }
      94%,100% { opacity:0; }
    }
    @keyframes before-publication {
      0%,39% { opacity:1; } 40%,89% { opacity:0; } 90%,100% { opacity:1; }
    }
    @keyframes after-publication {
      0%,39% { opacity:0; } 40%,89% { opacity:1; } 90%,100% { opacity:0; }
    }
    #build-caption { opacity:0; }
    </style>
  </defs>
  <rect width="840" height="844" fill="var(--background)"/>
  <text x="24" y="34" class="heading">Insertion changes the root, not the retained subtree</text>
  <text x="24" y="64" class="muted">Insert 1010: its highest differing bit is 4, above the existing split at bit 1.</text>
  <rect x="24" y="100" width="190" height="56" class="box blue"/>
  <text x="119" y="134" text-anchor="middle" class="label">Saved snapshot</text>
  <rect x="334" y="100" width="160" height="56" class="box gold"/>
  <text x="414" y="134" text-anchor="middle" class="label">Current pool root</text>
  <rect x="174" y="330" width="355" height="210" rx="14" class="frame"/>
  <path id="saved-root-link" class="edge" d="M119 156 V381 H250"/>
  <path id="current-before" class="edge" d="M414 156 V275 H350 V346"/>
  <path id="current-after" class="edge" d="M414 156 V181 H620 V212"/>
  <g id="new-links">
    <path class="edge" d="M575 282 V319 H350 V346"/>
    <path class="edge" d="M665 282 V433 H700 V462"/>
    <text x="508" y="311" class="label">0</text>
    <text x="674" y="365" class="label">1</text>
  </g>
  <g id="old-subtree">
    <rect x="250" y="346" width="200" height="70" class="box blue"/>
    <text x="350" y="375" text-anchor="middle" class="label">Existing split bit 1</text>
    <text x="350" y="400" text-anchor="middle" class="small">Same object throughout</text>
    <path class="edge" d="M300 416 V439 H235 V462"/>
    <path class="edge" d="M400 416 V439 H465 V462"/>
    <text x="247" y="434" class="small">0</text>
    <text x="449" y="434" class="small">1</text>
    <rect x="185" y="462" width="100" height="56" class="box blue"/>
    <rect x="415" y="462" width="100" height="56" class="box blue"/>
    <text x="235" y="496" text-anchor="middle" class="label">0010</text>
    <text x="465" y="496" text-anchor="middle" class="label">0011</text>
  </g>
  <g id="new-parent">
    <rect x="530" y="212" width="180" height="70" class="box gold"/>
    <text x="620" y="241" text-anchor="middle" class="label">New split bit 4</text>
    <text x="620" y="265" text-anchor="middle" class="small">New parent object</text>
  </g>
  <g id="incoming-leaf">
    <rect x="640" y="462" width="120" height="56" class="box purple"/>
    <text x="700" y="496" text-anchor="middle" class="label">1010</text>
  </g>
  <text x="24" y="577" id="build-caption" class="muted">Build new nodes first. Both roots still reference the existing subtree.</text>
  <text x="24" y="577" id="published-caption" class="muted">Publish the new root. The saved snapshot still reaches only 0010 and 0011.</text>
  <text x="24" y="618" class="label">Static graph states · R = current root; S = unchanged split-bit-1 subtree</text>
  <g id="static-before">
    <rect x="24" y="636" width="248" height="156" class="box blue"/>
    <text x="40" y="663" class="label">Before insertion</text>
    <text x="52" y="721" class="label">R</text>
    <path class="edge" d="M75 715 H166"/>
    <rect x="166" y="695" width="64" height="40" class="box blue"/>
    <text x="198" y="721" text-anchor="middle" class="label">S</text>
    <text x="40" y="773" class="small">Saved snapshot → S</text>
  </g>
  <g id="static-built">
    <rect x="296" y="636" width="248" height="156" class="box gold"/>
    <text x="312" y="663" class="label">Built, not published</text>
    <text x="314" y="745" class="label">R</text>
    <path class="edge" d="M337 738 H360"/>
    <rect x="386" y="678" width="64" height="32" class="box gold"/>
    <text x="418" y="701" text-anchor="middle" class="small">bit 4</text>
    <path class="edge" d="M402 710 V720 H389 V722"/>
    <path class="edge" d="M434 710 V720 H490 V722"/>
    <rect x="360" y="722" width="58" height="32" class="box blue"/>
    <text x="389" y="745" text-anchor="middle" class="small">S</text>
    <rect x="457" y="722" width="66" height="32" class="box purple"/>
    <text x="490" y="745" text-anchor="middle" class="small">1010</text>
    <text x="312" y="773" class="small">Saved snapshot → S</text>
  </g>
  <g id="static-published">
    <rect x="568" y="636" width="248" height="156" class="box gold"/>
    <text x="584" y="663" class="label">Published</text>
    <text x="584" y="701" class="label">R</text>
    <path class="edge" d="M609 694 H658"/>
    <rect x="658" y="678" width="64" height="32" class="box gold"/>
    <text x="690" y="701" text-anchor="middle" class="small">bit 4</text>
    <path class="edge" d="M674 710 V720 H645 V722"/>
    <path class="edge" d="M706 710 V720 H762 V722"/>
    <rect x="616" y="722" width="58" height="32" class="box blue"/>
    <text x="645" y="745" text-anchor="middle" class="small">S</text>
    <rect x="729" y="722" width="66" height="32" class="box purple"/>
    <text x="762" y="745" text-anchor="middle" class="small">1010</text>
    <text x="584" y="773" class="small">Saved snapshot → S</text>
  </g>
  <text x="24" y="826" class="small muted">Four-bit digests illustrate routing; production digests have 256 bits. Replay resets the example.</text>
</svg>
