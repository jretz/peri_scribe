<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="610" viewBox="0 0 840 610"
     role="img" aria-labelledby="chart-cumulative-title chart-cumulative-description" style="max-width:100%;height:auto">
  <title id="chart-cumulative-title">The empirical cumulative share changes only at observations</title>
  <desc id="chart-cumulative-description">Four fixed observations occur at one, two, two and four seconds on a logarithmic elapsed-time axis. A moving cutoff counts all observations at or below it, producing shares zero, one quarter, three quarters and one. Both two-second observations enter together. The complete labeled step curve remains visible in reduced motion, with a static cutoff at two seconds.</desc>
  <defs><style>
    :root { color-scheme:light dark; --background:#111820; --text:#e4edf5;
      --muted:#acbdcb; --blue:#172c3e; --blue-line:#74abd5;
      --gold:#362c1c; --gold-line:#dfb566; --purple:#2b253e; --purple-line:#b7a1e7; }
    @media (prefers-color-scheme:light) { :root { --background:#fbfcfe;
      --text:#172e40; --muted:#526779; --blue:#eaf3fc; --blue-line:#5791bf;
      --gold:#fff7e8; --gold-line:#ad7725; --purple:#f0edfa; --purple-line:#8065b5; } }
    text { fill:var(--text); font:16px system-ui,sans-serif; }
    .title { font-size:23px; font-weight:700; }
    .heading { font-size:18px; font-weight:650; }
    .muted { fill:var(--muted); }
    .blue { fill:var(--blue); stroke:var(--blue-line); stroke-width:2; }
    .purple { fill:var(--purple); stroke:var(--purple-line); stroke-width:2; }
    .line { fill:none; stroke:var(--muted); stroke-width:1.5; }
    .dashed { stroke-dasharray:5 5; }

    #elapsed-cutoff { transform:translateX(400px); }
    #cumulative-marker { transform:translateY(220px); }
    .sample { fill:var(--background); stroke:var(--muted); stroke-width:2; }
    .counted { fill:var(--gold-line); stroke:var(--gold-line); }
    .count-value { opacity:0; font-size:27px; font-weight:700; }
    #count-3 { opacity:1; }
    #sample-4 { fill:var(--background); stroke:var(--muted); }
    @media (prefers-reduced-motion:no-preference) {
      #elapsed-cutoff { animation:elapsed-query 22s linear infinite; }
      #cumulative-marker { animation:cumulative-share 22s steps(1,end) infinite; }
      #count-0 { animation:count-0 22s steps(1,end) infinite; }
      #count-1 { animation:count-1 22s steps(1,end) infinite; }
      #count-3 { animation:count-3 22s steps(1,end) infinite; }
      #count-4 { animation:count-4 22s steps(1,end) infinite; }
      #sample-1 { animation:included-1 22s steps(1,end) infinite; }
      #sample-2 { animation:included-3 22s steps(1,end) infinite; }
      #sample-3 { animation:included-3 22s steps(1,end) infinite; }
      #sample-4 { animation:included-4 22s steps(1,end) infinite; }
    }
@keyframes elapsed-query {
      0.0000000% { transform:translateX(140px); }
      9.0909091% { transform:translateX(140px); }
      45.4545455% { transform:translateX(680px); }
      54.5454545% { transform:translateX(680px); }
      90.9090909% { transform:translateX(140px); }
      100.0000000% { transform:translateX(140px); }
    }
@keyframes cumulative-share {
      0.0000000% { transform:translateY(400px); }
      13.1313131% { transform:translateY(340px); }
      26.5993266% { transform:translateY(220px); }
      40.0673401% { transform:translateY(160px); }
      59.9326645% { transform:translateY(220px); }
      73.4006779% { transform:translateY(340px); }
      86.8686914% { transform:translateY(400px); }
      100.0000000% { transform:translateY(400px); }
    }
@keyframes count-0 {
      0.0000000% { opacity:1; }
      13.1313131% { opacity:0; }
      26.5993266% { opacity:0; }
      40.0673401% { opacity:0; }
      59.9326645% { opacity:0; }
      73.4006779% { opacity:0; }
      86.8686914% { opacity:1; }
      100.0000000% { opacity:1; }
    }
@keyframes count-1 {
      0.0000000% { opacity:0; }
      13.1313131% { opacity:1; }
      26.5993266% { opacity:0; }
      40.0673401% { opacity:0; }
      59.9326645% { opacity:0; }
      73.4006779% { opacity:1; }
      86.8686914% { opacity:0; }
      100.0000000% { opacity:0; }
    }
@keyframes count-3 {
      0.0000000% { opacity:0; }
      13.1313131% { opacity:0; }
      26.5993266% { opacity:1; }
      40.0673401% { opacity:0; }
      59.9326645% { opacity:1; }
      73.4006779% { opacity:0; }
      86.8686914% { opacity:0; }
      100.0000000% { opacity:0; }
    }
@keyframes count-4 {
      0.0000000% { opacity:0; }
      13.1313131% { opacity:0; }
      26.5993266% { opacity:0; }
      40.0673401% { opacity:1; }
      59.9326645% { opacity:0; }
      73.4006779% { opacity:0; }
      86.8686914% { opacity:0; }
      100.0000000% { opacity:0; }
    }
@keyframes included-1 {
      0.0000000% { fill:var(--background);stroke:var(--muted); }
      13.1313131% { fill:var(--gold-line);stroke:var(--gold-line); }
      26.5993266% { fill:var(--gold-line);stroke:var(--gold-line); }
      40.0673401% { fill:var(--gold-line);stroke:var(--gold-line); }
      59.9326645% { fill:var(--gold-line);stroke:var(--gold-line); }
      73.4006779% { fill:var(--gold-line);stroke:var(--gold-line); }
      86.8686914% { fill:var(--background);stroke:var(--muted); }
      100.0000000% { fill:var(--background);stroke:var(--muted); }
    }
@keyframes included-3 {
      0.0000000% { fill:var(--background);stroke:var(--muted); }
      13.1313131% { fill:var(--background);stroke:var(--muted); }
      26.5993266% { fill:var(--gold-line);stroke:var(--gold-line); }
      40.0673401% { fill:var(--gold-line);stroke:var(--gold-line); }
      59.9326645% { fill:var(--gold-line);stroke:var(--gold-line); }
      73.4006779% { fill:var(--background);stroke:var(--muted); }
      86.8686914% { fill:var(--background);stroke:var(--muted); }
      100.0000000% { fill:var(--background);stroke:var(--muted); }
    }
@keyframes included-4 {
      0.0000000% { fill:var(--background);stroke:var(--muted); }
      13.1313131% { fill:var(--background);stroke:var(--muted); }
      26.5993266% { fill:var(--background);stroke:var(--muted); }
      40.0673401% { fill:var(--gold-line);stroke:var(--gold-line); }
      59.9326645% { fill:var(--background);stroke:var(--muted); }
      73.4006779% { fill:var(--background);stroke:var(--muted); }
      86.8686914% { fill:var(--background);stroke:var(--muted); }
      100.0000000% { fill:var(--background);stroke:var(--muted); }
    }

  </style></defs>
  <rect width="840" height="610" fill="var(--background)"/>
  <text x="24" y="36" class="title">Count observations at or below the moving cutoff</text>
  <text x="24" y="67" class="muted">Each sample contributes 25%; the two observations at 2 s enter together.</text>
  <path class="line" d="M90 132 V400 H700"/>
  <text x="27" y="166">100%</text><text x="37" y="226">75%</text>
  <text x="37" y="286">50%</text><text x="37" y="346">25%</text>
  <text x="48" y="406">0%</text>
  <path class="line dashed" d="M90 160 H700 M90 220 H700 M90 280 H700 M90 340 H700" opacity=".4"/>
  <path id="cdf-step-curve" d="M90 400 H200 V340 H400 V220 H600 V160 H700"
        fill="none" stroke="var(--blue-line)" stroke-width="4"/>
  <text x="220" y="327" class="heading">1 / 4</text>
  <text x="420" y="207" class="heading">3 / 4</text>
  <text x="620" y="147" class="heading">4 / 4</text>
  <text x="200" y="429" text-anchor="middle">1</text>
  <text x="400" y="429" text-anchor="middle">2</text>
  <text x="600" y="429" text-anchor="middle">4</text>
  <text x="380" y="459" text-anchor="middle" class="muted">Elapsed seconds · logarithmic x</text>
  <text x="24" y="501" class="muted">Samples</text>
  <circle id="sample-1" class="sample counted" cx="200" cy="496" r="8"/>
  <circle id="sample-2" class="sample counted" cx="400" cy="484" r="8"/>
  <circle id="sample-3" class="sample counted" cx="400" cy="508" r="8"/>
  <circle id="sample-4" class="sample" cx="600" cy="496" r="8"/>
  <g id="elapsed-cutoff">
    <path d="M0 117 V409 M0 475 V523" stroke="var(--gold-line)" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M-8 105 H8 L0 119 Z" fill="var(--gold-line)"/>
    <g id="cumulative-marker"><circle r="7" fill="var(--purple-line)" stroke="var(--background)" stroke-width="2"/></g>
  </g>
  <text x="755" y="268" text-anchor="middle" class="muted">Counted</text>
  <text id="count-0" class="count-value" x="755" y="307" text-anchor="middle">0 / 4</text>
  <text id="count-1" class="count-value" x="755" y="307" text-anchor="middle">1 / 4</text>
  <text id="count-3" class="count-value" x="755" y="307" text-anchor="middle">3 / 4</text>
  <text id="count-4" class="count-value" x="755" y="307" text-anchor="middle">4 / 4</text>
  <text x="24" y="559">The cutoff moves; fixed observations enter or leave the counted set.</text>
  <text x="24" y="587" class="muted">The labeled step curve preserves every intermediate share without animation.</text>

</svg>
