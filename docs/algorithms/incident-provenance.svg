<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="856"
     viewBox="0 0 840 856" role="img" aria-labelledby="figure-title figure-description"
     style="max-width:100%;height:auto">
  <title id="figure-title">Project each winning field with its own evidence</title>
  <desc id="figure-description">Two original noon reports stay visible. The perimeter
    report has 100 acres and 200 personnel, confirmed by formal report R1 in file P.
    The direct incident report has 120 acres, unconfirmed, from file L. Animated copies
    descend into sparse output records. The losing 100-acre field dissolves, while
    200 personnel travels with R1 and P and 120 acres travels with its unconfirmed L
    evidence. Static before, selection, and output states remain readable without motion.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--edge)"/>
    </marker>
    <style>
    :root { color-scheme: light dark;
      --background:#111820; --text:#e4edf5; --muted:#acbdcb;
      --edge:#9caebe; --blue:#172c3e; --blue-line:#6198c2;
      --gold:#362c1c; --gold-line:#c4a45f; --purple:#2b253e;
      --purple-line:#a391d0; }
    @media (prefers-color-scheme: light) {
      :root { --background:#fbfcfe; --text:#172e40;
        --muted:#526779; --edge:#526779; --blue:#eaf3fc; --blue-line:#5791bf;
        --gold:#fff7e8; --gold-line:#c69a46; --purple:#f0edfa;
        --purple-line:#9481c6; }
    }
    text { font-family:system-ui,sans-serif; font-size:17px; fill:var(--text); }
    .heading { font-size:22px; font-weight:700; }
    .label { font-weight:650; }
    .small { font-size:16px; }
    .muted { fill:var(--muted); }
    .blue { fill:var(--blue); stroke:var(--blue-line); }
    .gold { fill:var(--gold); stroke:var(--gold-line); }
    .purple { fill:var(--purple); stroke:var(--purple-line); }
    .box { stroke-width:2; rx:10; }
    .edge { fill:none; stroke:var(--edge); stroke-width:2; marker-end:url(#arrow); }
    .line { fill:none; stroke:var(--edge); stroke-width:2; }
    .frame { fill:none; stroke:var(--edge); stroke-width:1; stroke-dasharray:5 5; }

    .source-frame { fill:none; stroke:var(--edge); stroke-width:1.5; rx:12; }
    .field-title { font-size:19px; font-weight:700; }
    #personnel-projection { transform:translate(0,380px); }
    #area-projection { transform:translate(0,380px); }
    #losing-area { opacity:0; }
    @media (prefers-reduced-motion:no-preference) {
      #personnel-projection { animation:personnel-project 20s linear infinite; }
      #area-projection { animation:area-project 20s linear infinite; }
      #losing-area { animation:discard-area 20s linear infinite; }
    }
    @keyframes personnel-project {
      0%,15% { opacity:0; transform:translate(0,0); }
      16%,35% { opacity:1; transform:translate(0,0); }
      58%,89% { opacity:1; transform:translate(0,380px); }
      95%,100% { opacity:0; transform:translate(0,380px); }
    }
    @keyframes area-project {
      0%,15% { opacity:0; transform:translate(0,0); }
      16%,35% { opacity:1; transform:translate(0,0); }
      58%,89% { opacity:1; transform:translate(0,380px); }
      95%,100% { opacity:0; transform:translate(0,380px); }
    }
    @keyframes discard-area {
      0%,15% { opacity:0; transform:translate(0,0); }
      16%,22% { opacity:1; transform:translate(0,0); }
      30% { opacity:1; transform:translate(0,120px); }
      38%,100% { opacity:0; transform:translate(0,195px); }
    }
    </style>
    <g id="perimeter-acreage-field">
      <rect x="40" y="140" width="158" height="112" class="box blue"/>
      <text x="50" y="170" class="label">100 acres</text>
      <text x="50" y="200" class="small">Confirmed R1</text>
      <text x="50" y="230" class="small">File P · 12:00</text>
    </g>
    <g id="perimeter-personnel-field">
      <rect x="214" y="140" width="166" height="112" class="box blue"/>
      <text x="224" y="170" class="label">200 personnel</text>
      <text x="224" y="200" class="small">Confirmed R1</text>
      <text x="224" y="230" class="small">File P · 12:00</text>
    </g>
    <g id="incident-acreage-field">
      <rect x="460" y="140" width="166" height="112" class="box gold"/>
      <text x="470" y="170" class="label">120 acres</text>
      <text x="470" y="200" class="small">Unconfirmed</text>
      <text x="470" y="230" class="small">File L · 12:00</text>
    </g>
  </defs>
  <rect width="840" height="856" fill="var(--background)"/>
  <text x="24" y="34" class="heading">Project each winning field with its own evidence</text>
  <text x="24" y="64" class="muted">Value and supporting metadata travel together into separate sparse records.</text>
  <rect x="24" y="86" width="372" height="190" class="source-frame"/>
  <rect x="444" y="86" width="372" height="190" class="source-frame"/>
  <text x="40" y="117" class="label">Original perimeter report</text>
  <text x="460" y="117" class="label">Original direct incident report</text>
  <use href="#perimeter-acreage-field"/>
  <use href="#perimeter-personnel-field"/>
  <use href="#incident-acreage-field"/>
  <text x="646" y="170" class="small muted">Personnel</text>
  <text x="646" y="200" class="small muted">absent</text>
  <path class="edge" d="M420 353 V443"/>
  <rect x="24" y="466" width="372" height="184" class="source-frame"/>
  <rect x="444" y="466" width="372" height="184" class="source-frame"/>
  <text x="40" y="498" class="label">Sparse output P · personnel only</text>
  <text x="460" y="498" class="label">Sparse output L · acreage only</text>
  <text x="50" y="550" class="small muted">Acreage</text>
  <text x="50" y="580" class="small muted">omitted</text>
  <text x="646" y="550" class="small muted">Personnel</text>
  <text x="646" y="580" class="small muted">absent</text>
  <g id="losing-area"><use href="#perimeter-acreage-field"/></g>
  <g id="personnel-projection"><use href="#perimeter-personnel-field"/></g>
  <g id="area-projection"><use href="#incident-acreage-field"/></g>
  <text x="24" y="697" class="label">Static selection · originals above → field decisions → sparse outputs</text>
  <g id="static-field-selection">
    <rect x="24" y="717" width="792" height="96" class="box purple"/>
    <text x="40" y="746">Acreage:</text>
    <text x="139" y="746" class="muted">P 100</text>
    <path class="line" d="M137 740 H188"/>
    <path class="edge" d="M206 740 H256"/>
    <text x="276" y="746">L 120 wins · direct conflicting value has priority</text>
    <text x="40" y="786">Personnel:</text>
    <text x="139" y="786">P 200</text>
    <path class="edge" d="M206 780 H256"/>
    <text x="276" y="786">P 200 survives · confirmed R1 stays with this field</text>
  </g>
  <text x="24" y="841" class="small muted">One noon timestamp; two supporting reports. Motion projects records, not elapsed incident time.</text>
</svg>
