[tasks.peri_scribe]
description = "Run the main module"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe"

[tasks.update-kmz]
description = "Check for new source data and use it to generate new maps"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe update-kmz"

[tasks.ensure-admin-boundaries]
description = "Ensure needed administrative boundaries are available"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe ensure-admin-boundaries"

[tasks.validate-sources]
description = "Check that the stored sources cover a complete snapshot of every feed"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe validate-sources"

[tasks.format]
description = "Format with ruff"
depends = ["venv"]
run = "uv run ruff format --quiet"

[tasks.format-check]
description = "Check format with ruff"
depends = ["venv"]
run = "uv run ruff format --check --quiet"

[tasks.lint]
description = "Check and fix style with ruff"
depends = ["venv"]
run = "uv run ruff check --fix"

[tasks.typecheck]
description = "Check type hints with ty"
depends = ["venv"]
run = "uv run ty check"

[tasks.pytest]
description = "Run tests, then lint and typecheck"
depends = ["venv"]
run = "uv run --locked --module pytest"

[tasks.test]
description = "Run tests, then lint and typecheck"
run = [
    { task = "pytest" },
    { task = "lint" },
    { task = "typecheck" },
    { task = "format-check" },
]

[tasks.install-tools]
description = "Install all tools managed by mise"
sources = ["mise.toml"]
run = "mise install"

[tasks.upgrade-tools]
description = "Upgrade tools managed by mise"
run = "mise upgrade --local --minimum-release-age 3d"

[tasks.lock]
description = "Regenerate mise.lock from mise.toml"
depends = ["install-tools"]
sources = ["mise.toml"]
outputs = ["mise.lock"]
run = "mise lock"

[tasks.venv]
description = "Create or sync the uv virtual environment"
depends = ["install-tools"]
sources = ["mise.toml", "pyproject.toml", "uv.lock"]
run = "uv sync"

[tasks.gitignore]
description = "Regenerate .gitignore from gitnr templates"
run = [
    "gitnr create tt:Python tt:linux tt:macOS tt:VisualStudioCode > .gitignore",
    "echo '.codewhale' >> .gitignore",
    "echo '*.kml' >> .gitignore",
    "echo '*.kmz' >> .gitignore",
    "echo 'data/' >> .gitignore",
]

[settings]
task.output = "quiet"

[tools]
"cargo:gitnr" = "latest"
rg = "latest"
uv = "latest"
