[tasks.peri_scribe]
description = "Run the main module"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe"

[tasks.create-kml-template]
description = "Generate the KML template used to specify symbolization"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe create-kml-template"

[tasks.ensure-admin-boundaries]
description = "Ensure needed administrative boundaries are available"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe ensure-admin-boundaries"

[tasks.current-watermarks]
description = "Log the current watermark for each configured feed"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe current-watermarks"

[tasks.list-fires]
description = "Log the name, status, and identifier of each fire"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe list-fires"

[tasks.fetch]
description = "Fetch each configured feed into a GeoPackage"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe fetch"

[tasks.derive-geo-history]
description = "Derive the full and differential point and perimeter history for YEAR_DIRECTORY"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe derive-geo-history"

[tasks.index-fire-sources]
description = "Build the fire source index for YEAR_DIRECTORY"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe index-fire-sources"

[tasks.lint]
description = "Check and fix style/format with ruff"
depends = ["venv"]
run = "uv run ruff check --fix"

[tasks.typecheck]
description = "Check type hints with ty"
depends = ["venv"]
run = "uv run ty check"

[tasks.pytest]
description = "Run tests, then lint and typecheck"
depends = ["venv"]
run = "uv run --locked --module pytest"

[tasks.test]
description = "Run tests, then lint and typecheck"
run = [
    { task = "pytest" },
    { task = "lint" },
    { task = "typecheck" },
]

[tasks.install-tools]
description = "Install all tools managed by mise"
sources = ["mise.toml"]
run = "mise install"

[tasks.upgrade-tools]
description = "Upgrade tools managed by mise"
run = "mise upgrade --local --minimum-release-age 3d"

[tasks.lock]
description = "Regenerate mise.lock from mise.toml"
depends = ["install-tools"]
sources = ["mise.toml"]
outputs = ["mise.lock"]
run = "mise lock"

[tasks.venv]
description = "Create or sync the uv virtual environment"
depends = ["install-tools"]
sources = ["mise.toml", "pyproject.toml", "uv.lock"]
run = "uv sync"

[tasks.gitignore]
description = "Regenerate .gitignore from gitnr templates"
run = [
    "gitnr create tt:Python tt:linux tt:macOS tt:VisualStudioCode > .gitignore",
    "echo '.codewhale' >> .gitignore",
    "echo '*.kml' >> .gitignore",
    "echo '*.kmz' >> .gitignore",
    "echo 'data/' >> .gitignore",
]

[settings]
task.output = "quiet"

[tools]
"cargo:gitnr" = "latest"
uv = "latest"
