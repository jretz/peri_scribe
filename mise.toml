[tasks.peri_scribe]
description = "Run the main module"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe"

[tasks.run-offline]
description = "Run the main module's offline run command steps"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe run --from geography"

[tasks.monitor]
description = "Run the PeriScribe monitoring dashboard"
depends = ["venv"]
env = { COLORTERM = "truecolor" }
raw_args = true
run = "uv run --locked peri_scribe monitor"

[tasks.run-online]
description = "Run the main module's run command steps"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe run"

[tasks.kmz]
description = "Generate KMZ file"
depends = ["venv"]
raw_args = true
run = [
    "uv run --locked peri_scribe run --only kmz",
]

[tasks.reports]
description = "Generate reports"
depends = ["venv"]
raw_args = true
run = [
    "uv run --locked peri_scribe run --only reports",
]

[tasks.run-production]
description = "Check for new source data and use it to generate new maps and reports"
depends = ["venv"]
run = [
    'uv run --locked peri_scribe --stderr-log-level warning --file-log-level info run --full-fetch-interval 6h --publish-threshold "25 acres" 5m',
    { task = "sync-kmz" },
]

[tasks.sync-kmz]
description = "Ensure the latest KMZ is available for public download"
raw_args = true
run = 'rclone sync "data/$(date +%Y)/maps/PeriScribe Fires $(date +%Y).kmz" PeriScribe:peri-scribe'

[tasks.validate-sources]
description = "Check that the stored sources cover a complete snapshot of every feed"
depends = ["venv"]
raw_args = true
run = "uv run --locked peri_scribe validate-sources"

[tasks.coverage-report]
description = "Generate a coverage report from previously collected data"
depends = ["venv"]
run = "uv run coverage json --quiet --fail-under=100 -o .coverage/coverage.json"

[tasks.format]
description = "Format with ruff"
depends = ["venv"]
run = "uv run ruff format --quiet"

[tasks.format-check]
description = "Check format with ruff"
depends = ["venv"]
run = "uv run ruff format --check --config 'lint.ignore = [\"COM812\"]'"

[tasks.lint]
description = "Check and fix style with ruff"
depends = ["venv"]
run = [
    "rumdl check",
    "uv run ruff check --fix",
]

[tasks.typecheck]
description = "Check type hints with ty"
depends = ["venv"]
run = "uv run ty check"

[tasks.pytest]
description = "Run tests, then lint and typecheck"
depends = ["venv"]
env = { TEXTUAL_ANIMATIONS = "none" }
run = "uv run --locked --module pytest"

[tasks.test]
description = "Run tests, then lint and typecheck"
run = [
    { task = "pytest" },
    { task = "coverage-report" },
    { task = "lint" },
    { task = "typecheck" },
    { task = "format-check" },
]

[tasks.install-tools]
description = "Install all tools managed by mise"
sources = ["mise.toml"]
run = "mise install"

[tasks.upgrade-dependencies]
description = "Upgrade tools managed by mise and packages managed by uv"
run = [
    "mise upgrade --local --minimum-release-age 3d",
    { task = "lock" },
    { task = "geos" },
    'micromamba run --prefix "$GEOS_PREFIX" env CC=cc uv sync --upgrade',
    "touch .venv",
    { task = "test" },
]

[tasks.lock]
description = "Regenerate mise.lock from mise.toml"
depends = ["install-tools"]
sources = ["mise.toml"]
outputs = ["mise.lock"]
run = "mise lock"

# GEOS 3.15.0 fixes the overlay bug that can fill holes in perimeter unions:
# https://github.com/libgeos/geos/issues/1405
#
# As of 2026-09-08, Shapely maintainers plan to bundle GEOS 3.15 in Shapely 2.3;
# Shapely 2.2 is planned with GEOS 3.14:
# https://github.com/shapely/shapely/issues/2413#issuecomment-5582882915 Use
# conda-forge GEOS binaries and build Shapely against them until released
# Shapely wheels include the fix, then revisit these tasks and pyproject.toml's
# source build.
[tasks.geos]
description = "Install GEOS and a C compiler from conda-forge binaries"
depends = ["install-tools"]
sources = ["mise.toml"]
outputs = ["{{env.GEOS_PREFIX}}/conda-meta/history"]
run = 'micromamba create --yes --no-rc --override-channels --channel conda-forge --prefix "$GEOS_PREFIX" "geos=$GEOS_VERSION" c-compiler'

[tasks.venv]
description = "Sync Python packages and build Shapely against the project GEOS"
depends = ["geos"]
sources = ["mise.toml", "pyproject.toml", "uv.lock"]
outputs = [".venv/.geos"]
run = [
    'micromamba run --prefix "$GEOS_PREFIX" env CC=cc uv sync --locked --reinstall-package shapely',
    """
.venv/bin/python - <<'PY'
import os
import sys

import shapely

expected = os.environ["GEOS_VERSION"]
actual = shapely.geos_version_string
if actual != expected:
    sys.exit(f"Expected GEOS {expected}, loaded {actual}")
PY
""",
    "touch .venv/.geos",
]

[tasks.gitignore]
description = "Regenerate .gitignore from gitnr templates"
run = [
    "gitnr create tt:Python tt:linux tt:macOS tt:VisualStudioCode > .gitignore",
    "echo '.codewhale/' >> .gitignore",
    "echo '.hypothesis/' >> .gitignore",
    "echo '*.kml' >> .gitignore",
    "echo '*.kmz' >> .gitignore",
    "echo 'coverage.json' >> .gitignore",
    "echo 'data/' >> .gitignore",
    "echo 'pytest-slow-first.json' >> .gitignore",
]

[env]
_.python.venv = { path = ".venv" }
# Keep Shapely's build and runtime linked to the GEOS overlay fix documented above.
GEOS_VERSION = "3.15.0"
GEOS_PREFIX = "{{config_root}}/.cache/geos/{{env.GEOS_VERSION}}"
GEOS_INCLUDE_PATH = "{{env.GEOS_PREFIX}}/include"
GEOS_LIBRARY_PATH = "{{env.GEOS_PREFIX}}/lib"
LDFLAGS = '{{env.LDFLAGS | default(value="")}} -Wl,-rpath,"{{env.GEOS_LIBRARY_PATH}}"'
MAMBA_ROOT_PREFIX = "{{config_root}}/.cache/micromamba"
# Shapely's cached builds must use this checkout's GEOS library and version.
UV_CACHE_DIR = "{{config_root}}/.cache/uv/geos-{{env.GEOS_VERSION}}"

[settings]
task.quiet = true

[tools]
"cargo:gitnr" = "latest"
micromamba = "latest"
rclone = "latest"
rg = "latest"
rumdl = "latest"
uv = "latest"
