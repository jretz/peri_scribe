[deploy]
description = "Fetch and check out the deployment tag"
run = [
    "git fetch origin +refs/tags/deploy:refs/tags/deploy",
    "git checkout refs/tags/deploy",
]

[run-production]
description = "Check for new source data and use it to generate new maps and reports"
depends = ["venv"]
run = [
    'uv run --locked peri_scribe --stderr-log-level warning --file-log-level info run --full-fetch-interval 6h --publish-threshold "25 acres" 5m',
    { task = "sync-kmz" },
]

[sync-kmz]
description = "Sync maps and viewer files to public download storage"
raw_args = true
run = 'rclone sync "data/$(date +%Y)/maps/" PeriScribe:peri-scribe'
