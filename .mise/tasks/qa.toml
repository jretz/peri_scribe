[coverage-report]
description = "Report coverage and enforce Python and combined JavaScript requirements"
depends = ["venv", "node-dependencies"]
run = "node tests/helpers/report_coverage.mjs"

[format]
description = "Format with ruff"
depends = ["venv"]
run = "uv run ruff format --quiet"

[format-check]
description = "Check format with ruff"
depends = ["venv"]
run = "uv run ruff format --check --config 'lint.ignore = [\"COM812\"]'"

[lint]
description = "Check Markdown and fix Python lint issues"
depends = ["venv"]
run = [
    "rumdl check",
    "uv run ruff check --fix",
]

[typecheck]
description = "Check type hints with ty"
depends = ["venv"]
run = "uv run ty check"

[pytest]
description = "Run Python tests and collect coverage"
depends = ["venv"]
env = { TEXTUAL_ANIMATIONS = "none", TEXTUAL_FPS = "240" }
run = "uv run --locked --module tests.helpers.ordinary_lanes"

[test-viewer]
description = "Run simulated viewer tests and collect JavaScript coverage"
depends = ["node-dependencies"]
run = "node tests/helpers/run_viewer_tests.mjs"

[test-browser]
description = "Run offline Chromium tests and collect JavaScript coverage"
depends = ["browser-install"]
run = "node tests/helpers/run_browser_tests.mjs"

[test]
description = "Run regular checks in a fresh coverage session"
depends = ["node-dependencies"]
run = "node tests/helpers/run_test_suite.mjs"

[test-checks]
description = "Run checks within the coverage session created by test"
hide = true
run = [
    "node tests/helpers/check_coverage_session.mjs",
    { task = "pytest" },
    { task = "lint" },
    "mise run --jobs 4 test-viewer ::: typecheck ::: format-check ::: test-browser",
    { task = "coverage-report" },
]

[test-all]
description = "Run all tests"
run = [
    { task = "lint" },
    '''
PERI_SCRIBE_TLA_JAR="$(mise where github:tlaplus/tlaplus)/tla2tools.jar" \
    .venv/bin/python -m tests.formal.run --with-regular
''',
]

[test-all.env]
PYTHON_CPU_COUNT = "1"
PERI_SCRIBE_TEST_WORKERS = "5"
PERI_SCRIBE_TLC_JOBS = "3"
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
VECLIB_MAXIMUM_THREADS = "1"
RAYON_NUM_THREADS = "1"
